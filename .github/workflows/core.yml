name: Core (HC5861 optimized)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布到的 Release tag(留空则只生成 Artifact,不发布 Release)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两台 HC5861(MT7620A, MIPS 小端, 弱 CPU/内存)
          - target: mipsel-unknown-linux-musl
            is_mips: true
            artifact_name: easytier-mipsel-hc5861

          # 中转 VPS(x86_64, 资源充裕, 走常规 release 构建)
          - target: x86_64-unknown-linux-musl
            is_mips: false
            artifact_name: easytier-x86_64-vps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意：这里不能传 targets: mipsel-unknown-linux-musl
      # 该目标是 Tier-3,没有官方预编译 std,rustup target add / --target 安装会直接报错
      # 真正的跨架构编译完全靠下面 build 步骤里的 `-Z build-std` 现场编译 std 解决
      - name: Install Rust nightly (MIPS 需要 -Z build-std, 必须 nightly)
        if: matrix.is_mips
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Rust stable (VPS 用普通 stable 即可)
        if: ${{ !matrix.is_mips }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 兜底：不管上面 action 有没有把 target 装好, 这里显式再装一次并确认
      # 顺便装 musl-tools, 避免个别依赖(涉及 C 编译)在链接阶段找不到 musl 相关工具
      - name: Ensure musl target & tools installed (VPS)
        if: ${{ !matrix.is_mips }}
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target list --installed

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # ------- HC5861(MIPS)专用构建：优先压体积、降运行时内存占用 -------
      # opt-level=z   : 以体积最小为目标优化(而不是速度),弱设备上 I/O/网络是瓶颈, CPU 峰值需求不高
      # lto=fat       : 全量链接时优化,进一步裁掉无用代码路径
      # codegen-units=1: 牺牲编译并行度换运行时性能/体积(反正在 CI 的强机器上编译, 不心疼编译时间)
      # strip=symbols : 链接阶段直接去掉符号表, 减小最终文件体积
      # --features mips / --no-default-features: 沿用上游针对 MIPS 的必需 feature 开关(见下方说明)
      - name: Build (HC5861 / mipsel tuned)
        if: matrix.is_mips
        env:
          RUSTFLAGS: "-C opt-level=z -C strip=symbols"
        run: |
          cargo +nightly build --release --verbose \
            --target ${{ matrix.target }} \
            -Z build-std \
            --no-default-features --features mips

      # ------- VPS(x86_64)构建：正常性能优先, 同样做体积裁剪但不追极致 -------
      - name: Build (VPS / x86_64)
        if: ${{ !matrix.is_mips }}
        env:
          RUSTFLAGS: "-C opt-level=3 -C strip=symbols"
        run: |
          cargo build --release --verbose \
            --target ${{ matrix.target }}

      - name: Collect & strip binaries
        run: |
          set -e
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p out
          cp "$BIN_DIR/easytier-core" out/
          cp "$BIN_DIR/easytier-cli" out/
          # RUSTFLAGS 的 strip=symbols 通常已经够用, 这里再兜底跑一次 strip
          if command -v ${{ matrix.target }}-strip >/dev/null 2>&1; then
            ${{ matrix.target }}-strip out/easytier-core out/easytier-cli || true
          else
            strip out/easytier-core out/easytier-cli || true
          fi

      - name: Show binary info
        run: |
          file out/easytier-core
          ls -lh out/

      - name: Package
        run: |
          mkdir -p artifacts
          tar -C out -czvf artifacts/${{ matrix.artifact_name }}.tar.gz easytier-core easytier-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}.tar.gz
          retention-days: 90

      - name: Publish to Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: artifacts/${{ matrix.artifact_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
