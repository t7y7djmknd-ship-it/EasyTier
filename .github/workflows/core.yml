name: EasyTier Personal Core

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C panic=abort"

defaults:
  run:
    shell: bash

jobs:

  build:
    name: Build ${{ matrix.ARTIFACT_NAME }}

    strategy:
      fail-fast: true

      matrix:
        include:

          # ==========================================================
          # HC5861
          # MediaTek MT7620A
          # OpenWrt 23.05.4
          # MIPS32 little-endian / mipsel_24kc
          # ==========================================================
          - TARGET: mipsel-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mipsel

          # ==========================================================
          # Personal VPS
          # Debian Linux x86_64
          # ==========================================================
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64

    runs-on: ${{ matrix.OS }}

    env:
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Rust toolchain
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: |
            ${{ matrix.TARGET }}

      # ------------------------------------------------------------
      # Rust cache
      # ------------------------------------------------------------
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: easytier-personal
          shared-key: ${{ matrix.TARGET }}
          cache-targets: "false"

      # ------------------------------------------------------------
      # Build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            pkg-config \
            protobuf-compiler \
            musl-tools \
            curl \
            xz-utils

      # ------------------------------------------------------------
      # Build
      #
      # MIPS:
      #   EasyTier upstream workflow uses build-std because
      #   the MIPS target requires rebuilding std/panic_abort.
      #
      # x86_64:
      #   Normal musl release build.
      # ------------------------------------------------------------
      - name: Build EasyTier
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          set -eux

          if [[ "$TARGET" == "mipsel-unknown-linux-musl" ]]; then

            cargo build \
              --release \
              --target "$TARGET" \
              -Z build-std=std,panic_abort \
              --package easytier \
              --features=jemalloc

          else

            cargo build \
              --release \
              --target "$TARGET" \
              --package easytier \
              --features=jemalloc

          fi

      # ------------------------------------------------------------
      # Strip binaries
      # ------------------------------------------------------------
      - name: Strip binaries
        run: |
          set -eux

          BIN_DIR="target/$TARGET/release"

          for BIN in \
            "$BIN_DIR/easytier-core" \
            "$BIN_DIR/easytier-cli"
          do
            if [[ -f "$BIN" ]]; then
              echo "Stripping $BIN"

              if [[ "$TARGET" == "mipsel-unknown-linux-musl" ]]; then
                llvm-strip "$BIN" || true
              else
                strip "$BIN" || true
              fi
            fi
          done

      # ------------------------------------------------------------
      # Install UPX
      #
      # Only Linux binaries are produced here.
      # UPX failure must not make the build fail.
      # ------------------------------------------------------------
      - name: Install UPX
        run: |
          set -eux

          UPX_VERSION=4.2.4
          UPX_PKG="upx-${UPX_VERSION}-amd64_linux"

          curl -L \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_PKG}.tar.xz" \
            -o /tmp/upx.tar.xz

          tar -xJf /tmp/upx.tar.xz -C /tmp

          sudo cp \
            "/tmp/${UPX_PKG}/upx" \
            /usr/local/bin/upx

          upx --version

      # ------------------------------------------------------------
      # Compress binaries
      #
      # For the personal low-traffic use case, compression is useful
      # for reducing Flash usage, but it is not allowed to break CI.
      # ------------------------------------------------------------
      - name: Compress binaries
        run: |
          set -eux

          BIN_DIR="target/$TARGET/release"

          for BIN in \
            "$BIN_DIR/easytier-core" \
            "$BIN_DIR/easytier-cli"
          do
            if [[ -f "$BIN" ]]; then
              echo "Compressing $BIN"
              upx --lzma --best "$BIN" || true
            fi
          done

      # ------------------------------------------------------------
      # Prepare artifact
      # ------------------------------------------------------------
      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p artifacts

          BIN_DIR="target/$TARGET/release"

          test -f "$BIN_DIR/easytier-core"
          test -f "$BIN_DIR/easytier-cli"

          cp "$BIN_DIR/easytier-core" artifacts/
          cp "$BIN_DIR/easytier-cli" artifacts/

          echo
          echo "===== Binary information ====="
          file artifacts/easytier-core
          file artifacts/easytier-cli

          echo
          echo "===== Binary size ====="
          ls -lh artifacts/

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-${{ matrix.ARTIFACT_NAME }}
          path: artifacts/*
          if-no-files-found: error
