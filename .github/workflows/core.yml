name: EasyTier Core

on:
  workflow_dispatch:
  push:
    branches: [ "develop", "main", "releases/**" ]
  pull_request:
    branches: [ "develop", "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:

  # ================================================================
  # Pre-job
  # ================================================================
  pre_job:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-web/**", ".github/workflows/core.yml", ".github/actions/**"]

    outputs:
      should_skip: >-
        ${{
          (
            steps.skip_check.outputs.should_skip == 'true' ||
            (
              github.event_name == 'pull_request' &&
              steps.path_filter.outputs.relevant != 'true'
            )
          ) &&
          !startsWith(github.ref_name, 'releases/')
        }}

    steps:

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}


  # ================================================================
  # Web dashboard
  #
  # 保留原始 workflow 的 Web build。
  # 第一阶段不改变它。
  # ================================================================
  build_web:
    runs-on: ubuntu-latest

    needs: pre_job

    if: needs.pre_job.outputs.should_skip != 'true'

    steps:

      - uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          token: ${{ github.token }}
          build-filter: './easytier-web/*'

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-web-dashboard
          path: |
            easytier-web/frontend/dist/*


  # ================================================================
  # Build
  #
  # 这里只保留：
  #
  #   1. x86_64 Linux
  #   2. MIPS little-endian
  #
  # 其它平台全部删除。
  # ================================================================
  build:

    strategy:
      fail-fast: true

      matrix:
        include:

          # ----------------------------------------------------------
          # VPS
          # ----------------------------------------------------------
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64

          # ----------------------------------------------------------
          # HC5861 / MT7620A
          #
          # OpenWrt:
          #   mipsel_24kc
          #
          # ----------------------------------------------------------
          - TARGET: mipsel-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mipsel


    runs-on: ${{ matrix.OS }}

    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}

    needs:
      - pre_job
      - build_web

    if: needs.pre_job.outputs.should_skip != 'true'

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - uses: actions/checkout@v5


      # ------------------------------------------------------------
      # Git information
      # ------------------------------------------------------------
      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV


      # ------------------------------------------------------------
      # Download Web artifact
      #
      # 保留原 workflow。
      # ------------------------------------------------------------
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: easytier-web-dashboard
          path: easytier-web/frontend/dist/


      # ------------------------------------------------------------
      # Prepare build environment
      #
      # 完全保留原始设置。
      # ------------------------------------------------------------
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------------
      # Rust cache
      # ------------------------------------------------------------
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "core-registry"
          cache-targets: "false"


      # ------------------------------------------------------------
      # Zig
      #
      # 保留原始 workflow。
      # ------------------------------------------------------------
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          version: 0.16.0
          use-cache: true


      # ------------------------------------------------------------
      # cargo-zigbuild
      #
      # 保留原始 workflow。
      # ------------------------------------------------------------
      - uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          tool: cargo-zigbuild@0.23.2


      # ============================================================
      # Normal build
      #
      # MIPS 不进入这里。
      # ============================================================
      - name: Build
        if: ${{ !contains(matrix.TARGET, 'mips') }}

        run: |

          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi

          if [[ "$TARGET" =~ (x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|windows|darwin) ]]; then
            BUILD=build
          else
            BUILD=zigbuild
          fi

          if [[ "$TARGET" =~ ^(riscv64|loongarch64|aarch64).*$ || "$TARGET" =~ (freebsd|windows) ]]; then
            FEATURES="mimalloc"
          else
            FEATURES="jemalloc"
          fi

          cargo $BUILD --release --target $TARGET --package=easytier-web --features=embed

          mv \
            ./target/$TARGET/release/easytier-web"$SUFFIX" \
            ./target/$TARGET/release/easytier-web-embed"$SUFFIX"

          cargo $BUILD \
            --release \
            --target $TARGET \
            --features=$FEATURES


      # ============================================================
      # MIPS build
      #
      # 完全保留原始 EasyTier workflow 的 MIPS 方法。
      # ============================================================
      - name: Build (MIPS)

        if: ${{ contains(matrix.TARGET, 'mips') }}

        env:
          RUSTC_BOOTSTRAP: 1

        run: |

          cargo build \
            -r \
            --target $TARGET \
            -Z build-std=std,panic_abort \
            --package=easytier \
            --features=jemalloc


      # ============================================================
      # Compress
      #
      # 保留原始 workflow。
      # ============================================================
      - name: Compress

        run: |

          mkdir -p ./artifacts/objects/

          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          if [[ $OS =~ ^ubuntu.*$ && ! $TARGET =~ (loongarch|freebsd) ]]; then

            HOST_ARCH=$(uname -m)

            case $HOST_ARCH in
              x86_64)
                UPX_ARCH="amd64"
                ;;
              aarch64)
                UPX_ARCH="arm64"
                ;;
              *)
                UPX_ARCH="amd64"
                ;;
            esac

            UPX_VERSION=4.2.4
            UPX_PKG="upx-${UPX_VERSION}-${UPX_ARCH}_linux"

            curl \
              -L \
              "https://github.com/EasyTier/EasyTier/releases/download/v${UPX_VERSION}/${UPX_PKG}.tar.xz" \
              -s | tar xJvf -

            cp "${UPX_PKG}/upx" .

            UPX_BIN=./upx

          fi


          for BIN in \
            ./target/$TARGET/release/easytier-{core,cli,web,web-embed}
          do

            if [[ -f "$BIN" ]]; then

              if [[ -n "$UPX_BIN" ]]; then
                $UPX_BIN --lzma --best "$BIN" || true
              fi

              mv "$BIN" ./artifacts/objects/

            fi

          done


          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/


      # ============================================================
      # Archive
      # ============================================================
      - name: Archive artifact

        uses: actions/upload-artifact@v5

        with:
          name: easytier-${{ matrix.ARTIFACT_NAME }}

          path: |
            ./artifacts/*


  # ================================================================
  # Final result
  #
  # 删除 Magisk 后，只等待 pre_job + build_web + build。
  # ================================================================
  core-result:

    runs-on: ubuntu-latest

    needs:
      - pre_job
      - build_web
      - build

    if: >
      needs.pre_job.result == 'success' &&
      needs.pre_job.outputs.should_skip != 'true' &&
      !cancelled()

    steps:

      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
